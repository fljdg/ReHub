{% load static %}
<header class="app-nav">
    <a class="logo" href="{% url 'core:dashboard' %}">
        <img src="{% static 'core/images/logo.png' %}" alt="ReHub logo">
        <span class="logo-text">ReHub</span>
    </a>

    <form class="app-search" method="get" action="#" role="search">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" name="q" placeholder="Search" aria-label="Search">
    </form>

    <nav class="app-nav-links" aria-label="Main">
        <a href="{% url 'core:dashboard' %}" {% if nav == 'home' %}class="active" aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
            <span>Home</span>
        </a>
        <a href="{% url 'core:research' %}" {% if nav == 'research' %}class="active" aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.6 2h2.8l.5 2.1c.5.2 1 .4 1.4.7l2-.8 1.4 2.4-1.6 1.5c.1.5.1 1 0 1.5l1.6 1.5-1.400 2.400-2-.8c-.4.3-.9.5-1.400.7L12.400 15H9.600l-.5-2.100c-.5-.2-1-.4-1.400-.7l-2 .8L4.300 10.600l1.600-1.500a5 5 0 0 1 0-1.500L4.300 6.100l1.400-2.400 2 .8c.4-.3.900-.5 1.400-.7L9.600 2zM11 6.200a2.800 2.800 0 1 0 0 5.600 2.800 2.800 0 0 0 0-5.600z"/><circle cx="15.500" cy="15.500" r="3.400" fill="#eceef0" stroke="currentColor" stroke-width="1.900"/><path d="M18 18 21.500 21.500" stroke="currentColor" stroke-width="2.300" stroke-linecap="round"/></svg>
            <span>My Research</span>
        </a>
        <a href="{% url 'core:group' %}" {% if nav == 'group' %}class="active" aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="3"/><circle cx="5.5" cy="9.5" r="2.2"/><circle cx="18.5" cy="9.5" r="2.2"/><path d="M12 13c-3 0-6 1.5-6 3.5V19h12v-2.5c0-2-3-3.5-6-3.5zM5.5 13c-1.8 0-4 1-4 2.5V18H5v-1.5c0-1.2.5-2.300 1.400-3.1-.3-.3-.6-.4-.9-.4zM18.5 13c-.3 0-.6.1-.9.2.9.8 1.400 1.900 1.400 3.1V18h3.5v-2.5c0-1.5-2.2-2.5-4-2.5z"/></svg>
            <span>Group</span>
        </a>
        <a href="{% url 'core:calendar' %}" {% if nav == 'calendar' %}class="active" aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3.5v3M16 3.5v3"/><g fill="currentColor" stroke="none"><circle cx="8" cy="13.2" r="1"/><circle cx="12" cy="13.2" r="1"/><circle cx="16" cy="13.2" r="1"/><circle cx="8" cy="17" r="1"/><circle cx="12" cy="17" r="1"/><circle cx="16" cy="17" r="1"/></g></svg>
            <span>Calendar</span>
        </a>
    </nav>

    <div class="app-nav-right">
        <a href="#" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5a6 6 0 0 0-5-5.9V4a1 1 0 0 0-2 0v1.1A6 6 0 0 0 6 11v5l-2 2v1h16v-1z"/></svg>
            <span>Notifications</span>
        </a>
        <a href="{% url 'core:profile' %}" {% if nav == 'me' %}class="active" aria-current="page"{% endif %}>
            {% if request.user.profile.avatar %}<img class="nav-avatar" src="{{ request.user.profile.avatar.url }}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="nav-avatar" style="display:none">{{ initials }}</span>{% else %}<span class="nav-avatar">{{ initials }}</span>{% endif %}
            <span>Me</span>
        </a>
    </div>
</header>
