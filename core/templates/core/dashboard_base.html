{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReHub | Dashboard{% endblock %}</title>

    <link rel="icon" href="{% static 'core/images/logoTwo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body class="dash-body">

<div class="dash-shell" id="dash-shell">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="dash-sidebar">
        <div class="sidebar-head">
            <a class="sidebar-logo" href="{% url 'core:dashboard' %}">
                <img src="{% static 'core/images/logoTwo.png' %}" alt="ReHub logo">
                <span>ReHub</span>
            </a>
            <button type="button" class="collapse-btn" id="collapse-btn" aria-label="Collapse sidebar" aria-expanded="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 6l-6 6 6 6"></path>
                </svg>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a href="{% url 'core:dashboard' %}" class="{% block nav_dashboard %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>
                <span class="label">Dashboard</span>
            </a>
            <a href="#" class="{% block nav_research %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5"></circle><path d="M11.5 11.5L20 20"></path><path d="M8 5.5v5M5.5 8h5"></path></svg>
                <span class="label">My Research</span>
            </a>
            <a href="#" class="{% block nav_ai %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4L5.6 5.6"></path></svg>
                <span class="label">AI Research Assistant</span>
            </a>
            <a href="#" class="{% block nav_calendar %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M3 9.5h18M8 3v3M16 3v3"></path></svg>
                <span class="label">Calendar</span>
            </a>
        </nav>

        <div class="sidebar-user">
            <span class="avatar">{{ initials }}</span>
            <span class="user-text">
                <strong>{{ display_name }}</strong>
                <em>{{ role }}</em>
            </span>
        </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <div class="dash-main">
        <header class="dash-topbar">
            <label class="dash-search">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <input type="search" placeholder="Search">
            </label>

            <div class="dash-topbar-right">
                <button type="button" class="icon-btn" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
                </button>

                <div class="topbar-user">
                    <span class="avatar">{{ initials }}</span>
                    <span class="user-text">
                        <strong>{{ display_name }}</strong>
                        <em>{{ role }}</em>
                    </span>
                </div>
            </div>
        </header>

        <main class="dash-content">
            {% block content %}{% endblock %}
        </main>
    </div>

</div>

<script>
    (function () {
        var shell = document.getElementById('dash-shell');
        var btn = document.getElementById('collapse-btn');
        var KEY = 'rehub-sidebar-collapsed';

        function apply(collapsed) {
            shell.classList.toggle('collapsed', collapsed);
            btn.setAttribute('aria-expanded', String(!collapsed));
        }

        try {
            apply(localStorage.getItem(KEY) === '1');
        } catch (e) { /* storage unavailable — default to expanded */ }

        btn.addEventListener('click', function () {
            var collapsed = !shell.classList.contains('collapsed');
            apply(collapsed);
            try { localStorage.setItem(KEY, collapsed ? '1' : '0'); } catch (e) {}
        });
    })();
</script>

{% block scripts %}{% endblock %}

</body>
</html>
