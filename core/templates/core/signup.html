{% extends 'core/base.html' %}
{% load static %}

{% block title %}ReHub | Get Started{% endblock %}

{% block content %}
<style>
    .pw-wrap { position: relative; width: 100%; }
    .pw-wrap .field { padding-right: 48px; }
    .pw-eye {
        position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        background: none; border: 0; padding: 4px; cursor: pointer;
        color: #6b7785; display: grid; place-items: center;
    }
    .pw-eye:hover { color: #0077bb; }
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear { display: none; }
</style>

<section class="auth auth-media-right">

    <div class="auth-media">
        <img src="{% static 'core/images/getStarted.png' %}" alt="Searching for research online">
        <span class="auth-fade" aria-hidden="true"></span>
    </div>

    <div class="auth-panel">
        <form class="auth-form" method="post" action="{% url 'core:signup' %}">
            {% csrf_token %}

            <header class="auth-head">
                <h1 class="title-gradient">Get Started!</h1>
                <p class="auth-sub">Please sign up to your account</p>
            </header>

            {% if errors %}
            <ul class="auth-error" style="padding-left:18px;">
                {% for error in errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
            {% endif %}

            <div class="field-row">
                <div>
                    <label class="sr-only" for="id_first_name">First name</label>
                    <input class="field" id="id_first_name" type="text" name="first_name"
                           placeholder="First Name" autocomplete="given-name" value="{{ request.POST.first_name|default:'' }}" required>
                </div>
                <div>
                    <label class="sr-only" for="id_last_name">Last name</label>
                    <input class="field" id="id_last_name" type="text" name="last_name"
                           placeholder="Last Name" autocomplete="family-name" value="{{ request.POST.last_name|default:'' }}" required>
                </div>
            </div>

            <label class="sr-only" for="id_email">Email</label>
            <input class="field" id="id_email" type="email" name="email"
                   placeholder="Email" autocomplete="email" value="{{ request.POST.email|default:'' }}" required>

            <div class="field-row">
                <div class="pw-wrap">
                    <label class="sr-only" for="id_password1">Password</label>
                    <input class="field" id="id_password1" type="password" name="password1"
                           placeholder="Password" autocomplete="new-password" required>
                    <button type="button" class="pw-eye" aria-label="Show password"></button>
                </div>
                <div class="pw-wrap">
                    <label class="sr-only" for="id_password2">Confirm password</label>
                    <input class="field" id="id_password2" type="password" name="password2"
                           placeholder="Confirm Password" autocomplete="new-password" required>
                    <button type="button" class="pw-eye" aria-label="Show password"></button>
                </div>
            </div>

            <div class="auth-row">
                <label class="auth-check">
                    <input type="checkbox" name="terms" required>
                    <span class="box" aria-hidden="true"></span>
                    <span>I accept the <a class="auth-link" href="#">Terms and Conditions</a></span>
                </label>
            </div>

            <button class="btn-submit" type="submit">Sign Up</button>
        </form>
    </div>

</section>

<script>
(function () {
    var eye = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    var eyeOff = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/></svg>';

    document.querySelectorAll('.pw-wrap').forEach(function (wrap) {
        var input = wrap.querySelector('input');
        var btn = wrap.querySelector('.pw-eye');
        btn.innerHTML = eye;
        btn.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.innerHTML = show ? eyeOff : eye;
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    });
})();
</script>
{% endblock %}
