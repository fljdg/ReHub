{% extends 'core/base.html' %}
{% load static %}

{% block title %}ReHub | Login{% endblock %}

{% block content %}
<section class="auth auth-media-left">

    <div class="auth-media">
        <img src="{% static 'core/images/login.png' %}" alt="Stack of bound research papers">
        <span class="auth-fade" aria-hidden="true"></span>
    </div>

    <div class="auth-panel">
        <form class="auth-form" method="post" action="{% url 'core:login' %}">
            {% csrf_token %}

            <header class="auth-head">
                <h1 class="title-gradient">Welcome Back!</h1>
                <p class="auth-sub">Please login to your account</p>
            </header>

            {% if error %}
            <p class="auth-error">{{ error }}</p>
            {% endif %}

            <label class="sr-only" for="id_username">Email</label>
            <input class="field" id="id_username" type="email" name="username"
                   placeholder="Email" autocomplete="email" value="{{ request.POST.username|default:'' }}" required>

            <label class="sr-only" for="id_password">Password</label>
            <div class="pw-wrap">
                <input class="field" id="id_password" type="password" name="password"
                       placeholder="Password" autocomplete="current-password" required>
                <button class="pw-toggle" id="pwToggle" type="button"
                        aria-label="Show password" aria-pressed="false">
                    <!-- eye (shown when password is hidden) -->
                    <svg class="icon-eye" viewBox="0 0 24 24" width="22" height="22" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <!-- eye-off (shown when password is visible) -->
                    <svg class="icon-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                        <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>

            <div class="auth-row">
                <label class="auth-check">
                    <input type="checkbox" name="remember">
                    <span class="box" aria-hidden="true"></span>
                    <span>Remember me</span>
                </label>
                <a class="auth-link" href="#">Forgot Password?</a>
            </div>

            <button class="btn-submit" type="submit">Login</button>
        </form>
    </div>

</section>

<style>
    .pw-wrap { position: relative; width: 100%; }
    .pw-wrap .field { width: 100%; padding-right: 3.2rem; box-sizing: border-box; }
    .pw-toggle {
        position: absolute; top: 50%; right: 1rem; transform: translateY(-50%);
        background: none; border: 0; padding: .25rem; cursor: pointer;
        color: #6b7280; display: flex; align-items: center; justify-content: center;
    }
    .pw-toggle:hover, .pw-toggle:focus-visible { color: #0a7cc4; outline: none; }
    .pw-toggle .icon-eye-off { display: none; }
    .pw-toggle.is-visible .icon-eye { display: none; }
    .pw-toggle.is-visible .icon-eye-off { display: block; }
    /* hide Edge's built-in reveal button so there's only one eye */
    #id_password::-ms-reveal, #id_password::-ms-clear { display: none; }
</style>

<script>
    (function () {
        var input = document.getElementById('id_password');
        var btn = document.getElementById('pwToggle');
        btn.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.classList.toggle('is-visible', show);
            btn.setAttribute('aria-pressed', show);
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    })();
</script>
{% endblock %}
