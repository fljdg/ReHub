{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReHub | My Research{% endblock %}</title>

    <link rel="icon" href="{% static 'core/images/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/appnav.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/research.css' %}">
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}app-body{% endblock %}">

{% include 'core/_appnav.html' with nav=active_nav|default:'research' %}

{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
