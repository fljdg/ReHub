{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReHub{% endblock %}</title>

    <link rel="icon" href="{% static 'core/images/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>

<!-- ===================== NAVBAR ===================== -->
<header class="navbar">
    <div class="nav-inner">
        <a class="logo" href="{% url 'core:home' %}">
            <img src="{% static 'core/images/logo.png' %}" alt="ReHub logo">
            <span class="logo-text">ReHub</span>
        </a>

        <nav class="nav-links">
            <a href="{% url 'core:home' %}">Home</a>
            <a href="{% url 'core:home' %}#features">Features</a>
            <a href="{% url 'core:home' %}#demonstration">Demonstration</a>
            <a href="{% url 'core:home' %}#about">About</a>
            <a href="{% url 'core:home' %}#contact">Contact</a>
        </nav>

        <div class="nav-actions">
            <a href="{% url 'core:login' %}" class="btn btn-ghost">Login</a>
            <a href="{% url 'core:signup' %}" class="btn btn-gradient">Get Started</a>
        </div>
    </div>
</header>

{% block content %}{% endblock %}

{% block footer %}{% endblock %}

{% block scripts %}{% endblock %}

</body>
</html>
